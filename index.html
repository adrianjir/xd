<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugar - Alianza Lima</title>
    <style>
        :root {
            --alianza-blue: #002366;
            --alianza-white: #ffffff;
            --alianza-gray: #f3f4f6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--alianza-blue) 0%, #000c20 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .game-container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: var(--alianza-white);
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        .button {
            display: inline-block;
            padding: 15px 30px;
            background-color: var(--alianza-white);
            color: var(--alianza-blue);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .logo {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <img src="https://logodownload.org/wp-content/uploads/2019/04/alianza-lima-logo-escudo-0.png" alt="Escudo Alianza Lima" class="logo">
        <h1>¡Bienvenido al Juego de Alianza Lima!</h1>
        <p>Esta es la página de juego del Club Alianza Lima. Aquí podrás disfrutar pronto de diferentes actividades interactivas.</p>
        <p>Estamos trabajando para ofrecerte la mejor experiencia. ¡Vuelve pronto!</p>
        <a href="index.html" class="button">Volver al Menú Principal</a>
    </div>
</body>
</html>
